<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% unless page.url == '/' %}{{ page.title }} · {% endunless %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500&family=Lora:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body class="{% if page.url == '/' %}home{% else %}reading{% endif %}">
<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}">The Void</a>
  <a class="nav-link" href="{{ '/' | relative_url }}">All books</a>
</header>
<main>
{{ content }}
</main>
<footer class="site-footer">© {{ 'now' | date: '%Y' }} {{ site.author }}</footer>
</body>
</html>
