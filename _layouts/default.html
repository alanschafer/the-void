<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% unless page.url == '/' %}{{ page.title }} · {% endunless %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<meta name="theme-color" content="#050505">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body class="{% if page.url == '/' %}home{% else %}reading{% endif %}">
<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}">The Void</a>
  <a class="nav-link" href="{{ '/' | relative_url }}">The Collection</a>
</header>
<div class="rule"><span>◆</span></div>
<main>
{{ content }}
</main>
<div class="rule"><span>◆</span></div>
<footer class="site-footer">© {{ 'now' | date: '%Y' }} · {{ site.author }}</footer>
</body>
</html>
