---
layout: default
title: The Void
body_class: home
---
<section class="hero">
  <div class="eclipse">
    <div class="eclipse-text">
      <h1>The Void</h1>
      <p>{{ site.tagline }}</p>
    </div>
  </div>
</section>

<section class="shelf" aria-labelledby="shelf-title">
  <h2 id="shelf-title">Books</h2>
  <div class="cards">
    {% for book in site.books %}
    <a class="card" href="{{ book.url | relative_url }}">
      <span class="cover">
        <span class="cover-title">{{ book.title }}</span>
        <span class="cover-author">{{ book.author | default: site.author }}</span>
      </span>
      {% if book.summary %}<span class="card-note">{{ book.summary }}</span>{% endif %}
    </a>
    {% endfor %}
  </div>
</section>
